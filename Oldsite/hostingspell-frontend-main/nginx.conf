# ============================
# hostingspell.com (Next.js + /blog proxy to blog.2hs.in)
# ============================

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name hostingspell.com;
    return 301 https://$host$request_uri;
}

# --- HTTPS ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hostingspell.com;

    # --- Certbot TLS (yours) ---
    ssl_certificate     /etc/letsencrypt/live/hostingspell.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hostingspell.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- ACME challenge passthrough ---
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    # --- Common proxy headers for your Next.js app ---
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # --- Gzip (safe types) ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types
        text/plain text/css
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml image/svg+xml;

    # =========================
    # Next.js app (port :3000)
    # =========================
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 30s;
        proxy_buffering on;
        proxy_buffers 16 64k;
        proxy_buffer_size 128k;
        proxy_busy_buffers_size 128k;
    }

    # =========================================
    # /blog → reverse proxy to https://blog.2hs.in
    # =========================================

    # Allow HTML rewriting (disable upstream compression)
    proxy_set_header Accept-Encoding "";

    # Enable SNI for TLS to blog.2hs.in (prevents 502 on HTTPS upstreams)
    proxy_ssl_server_name on;
    proxy_ssl_name blog.2hs.in;

    # Faster media: cache uploads separately (optional)
    location ^~ /blog/wp-content/uploads/ {
        proxy_pass https://blog.2hs.in/wp-content/uploads/;
        proxy_read_timeout 60s;

        # Make origin happy: send its own Host
        proxy_set_header Host blog.2hs.in;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Catch-all for the blog
    location ^~ /blog/ {
        proxy_pass https://blog.2hs.in/;
        proxy_read_timeout 120s;

        # Send correct Host to WP origin (important!)
        proxy_set_header Host blog.2hs.in;

        # --- Cookie rewrites ---
        proxy_cookie_domain blog.2hs.in hostingspell.com;
        proxy_cookie_path / /blog;

        # --- HTML link rewrites (requires ngx_http_sub_module) ---
        sub_filter_once off;
        sub_filter 'https://blog.2hs.in/' 'https://hostingspell.com/blog/';
        sub_filter 'http://blog.2hs.in/'  'https://hostingspell.com/blog/';
        sub_filter '//blog.2hs.in/' '/blog/';
        sub_filter 'https://blog.2hs.in' 'https://hostingspell.com';
        sub_filter 'http://blog.2hs.in'  'https://hostingspell.com';
    }

    # --- Security headers (tweak as desired) ---
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header X-XSS-Protection "1; mode=block";
}