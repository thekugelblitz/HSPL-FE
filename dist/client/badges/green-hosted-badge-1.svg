<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="320" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="border1" x1="0" y1="0" x2="320" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="leaf1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Rounded container -->
  <rect x="2" y="2" width="316" height="86" rx="14" fill="url(#bg1)" stroke="url(#border1)" stroke-width="2"/>

  <!-- HostingSpell H Logo Mark -->
  <g transform="translate(18, 20) scale(0.38)">
    <!-- Outer rounded square -->
    <rect x="2" y="2" width="126" height="126" rx="22" fill="none" stroke="#34d399" stroke-width="7"/>
    <!-- H shape with server lines -->
    <rect x="24" y="22" width="18" height="86" rx="4" fill="#34d399"/>
    <rect x="86" y="22" width="18" height="86" rx="4" fill="#34d399"/>
    <rect x="42" y="52" width="44" height="16" rx="3" fill="#34d399"/>
    <!-- Server rack lines -->
    <rect x="28" y="30" width="10" height="3" rx="1.5" fill="#022c22"/>
    <rect x="28" y="38" width="10" height="3" rx="1.5" fill="#022c22"/>
    <rect x="28" y="46" width="10" height="3" rx="1.5" fill="#022c22"/>
    <rect x="90" y="76" width="10" height="3" rx="1.5" fill="#022c22"/>
    <rect x="90" y="84" width="10" height="3" rx="1.5" fill="#022c22"/>
    <rect x="90" y="92" width="10" height="3" rx="1.5" fill="#022c22"/>
  </g>

  <!-- Leaf accent -->
  <g transform="translate(22, 60)">
    <path d="M16 0C8 0 3 5 3 12C12 12 17 8 17 2V0H16Z" fill="url(#leaf1)" opacity="0.7"/>
  </g>

  <!-- Vertical divider -->
  <line x1="72" y1="16" x2="72" y2="74" stroke="#10b981" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Text content -->
  <text x="86" y="32" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="10" font-weight="800" fill="#6ee7b7" letter-spacing="1.5" text-rendering="geometricPrecision">VERIFIED GREEN HOSTING</text>
  <text x="86" y="52" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-rendering="geometricPrecision">100% Renewable Energy</text>
  <text x="86" y="70" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="10" font-weight="800" fill="#a7f3d0" letter-spacing="0.8" text-rendering="geometricPrecision">Powered by HostingSpell</text>
</svg>
