<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="320" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="border3" x1="0" y1="0" x2="320" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="iconBg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Light container -->
  <rect x="2" y="2" width="316" height="86" rx="14" fill="url(#bg3)" stroke="url(#border3)" stroke-width="2"/>

  <!-- Green pill icon bg -->
  <rect x="14" y="14" width="60" height="62" rx="12" fill="url(#iconBg3)"/>

  <!-- HostingSpell H logo (white on green) -->
  <g transform="translate(24, 22) scale(0.3)">
    <rect x="2" y="2" width="126" height="126" rx="22" fill="none" stroke="#ffffff" stroke-width="7" stroke-opacity="0.5"/>
    <rect x="24" y="22" width="18" height="86" rx="4" fill="#ffffff"/>
    <rect x="86" y="22" width="18" height="86" rx="4" fill="#ffffff"/>
    <rect x="42" y="52" width="44" height="16" rx="3" fill="#ffffff"/>
    <rect x="28" y="30" width="10" height="3" rx="1.5" fill="#047857"/>
    <rect x="28" y="38" width="10" height="3" rx="1.5" fill="#047857"/>
    <rect x="28" y="46" width="10" height="3" rx="1.5" fill="#047857"/>
    <rect x="90" y="76" width="10" height="3" rx="1.5" fill="#047857"/>
    <rect x="90" y="84" width="10" height="3" rx="1.5" fill="#047857"/>
    <rect x="90" y="92" width="10" height="3" rx="1.5" fill="#047857"/>
  </g>

  <!-- Leaf accent on icon -->
  <g transform="translate(54, 56)">
    <path d="M14 0C7 0 2 4.5 2 10.5C10 10.5 15 7 15 1.5V0H14Z" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Vertical divider -->
  <line x1="84" y1="16" x2="84" y2="74" stroke="#10b981" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Text content (dark text for light badge) -->
  <text x="98" y="30" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="10" font-weight="800" fill="#047857" letter-spacing="1.5" text-rendering="geometricPrecision">100% GREEN WEB HOSTING</text>
  <text x="98" y="50" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="16" font-weight="900" fill="#022c22" text-rendering="geometricPrecision">Eco-Certified Website</text>
  <text x="98" y="68" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="10" font-weight="800" fill="#059669" letter-spacing="0.8" text-rendering="geometricPrecision">Powered by HostingSpell</text>
</svg>
