<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="320" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="sealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Rounded container -->
  <rect x="2" y="2" width="316" height="86" rx="14" fill="url(#bg2)" stroke="#27272a" stroke-width="2"/>

  <!-- Certification seal circle -->
  <circle cx="44" cy="45" r="30" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="44" cy="45" r="24" fill="url(#sealGrad)"/>
  <circle cx="44" cy="45" r="20" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 3"/>

  <!-- HostingSpell H logo inside seal (white) -->
  <g transform="translate(28, 29) scale(0.25)">
    <rect x="2" y="2" width="126" height="126" rx="22" fill="none" stroke="#ffffff" stroke-width="8"/>
    <rect x="24" y="22" width="18" height="86" rx="4" fill="#ffffff"/>
    <rect x="86" y="22" width="18" height="86" rx="4" fill="#ffffff"/>
    <rect x="42" y="52" width="44" height="16" rx="3" fill="#ffffff"/>
    <rect x="28" y="30" width="10" height="3" rx="1.5" fill="#059669"/>
    <rect x="28" y="38" width="10" height="3" rx="1.5" fill="#059669"/>
    <rect x="28" y="46" width="10" height="3" rx="1.5" fill="#059669"/>
    <rect x="90" y="76" width="10" height="3" rx="1.5" fill="#059669"/>
    <rect x="90" y="84" width="10" height="3" rx="1.5" fill="#059669"/>
    <rect x="90" y="92" width="10" height="3" rx="1.5" fill="#059669"/>
  </g>

  <!-- Vertical divider -->
  <line x1="82" y1="16" x2="82" y2="74" stroke="#27272a" stroke-width="1.5"/>

  <!-- Text content -->
  <text x="96" y="30" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="10" font-weight="800" fill="#34d399" letter-spacing="1.5" text-rendering="geometricPrecision">ZERO-CARBON WEB HOSTING</text>
  <text x="96" y="50" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-rendering="geometricPrecision">100% Green Certified</text>
  <text x="96" y="68" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="10" font-weight="800" fill="#6ee7b7" letter-spacing="0.8" text-rendering="geometricPrecision">Verified by HostingSpell</text>
</svg>
